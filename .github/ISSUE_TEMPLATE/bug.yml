name: Bug report
description: Report a reproducible defect with evidence and expected behavior.
title: "bug: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private endpoints, or production payloads.
  - type: textarea
    id: problem
    attributes:
      label: Problem and impact
      description: What fails, and who or what is affected?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact steps or a small self-contained example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Commit/release, Go version, OS/architecture, and relevant SDK/service versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant logs, errors, traces, test output, and frequency. Remove sensitive values.
  - type: textarea
    id: regression
    attributes:
      label: Regression test or verification proposal
