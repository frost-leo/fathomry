name: Implementation or maintenance task
description: Track one focused, independently verifiable unit of work.
title: "chore: "
labels: ["type: task", "status: triage"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and verification
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
  - type: textarea
    id: risks
    attributes:
      label: Compatibility, safety, and rollout considerations
