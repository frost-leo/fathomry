name: Performance or capacity investigation
description: Investigate a measured bottleneck with equivalent workloads and correctness controls.
title: "perf: "
labels: ["type: research", "concern: performance", "status: triage"]
body:
  - type: textarea
    id: workload
    attributes:
      label: Workload and environment
      description: Versions, hardware, payload distribution, concurrency, duration, and warm/cold state.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Baseline and observed bottleneck
      description: Include latency distribution, throughput, allocations, memory, goroutines, or connections.
    validations:
      required: true
  - type: textarea
    id: experiment
    attributes:
      label: Controlled experiment and ablations
      description: Compare equivalent SDK/wrapper settings and identify what evidence would reject the hypothesis.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Correctness and resource guarantees that must remain intact
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Acceptance target and limitations
    validations:
      required: true
