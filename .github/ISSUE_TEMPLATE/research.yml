name: Architecture or research proposal
description: Investigate a bounded question using sources and experiments.
title: "research: "
labels: ["type: research", "area: architecture", "status: triage"]
body:
  - type: textarea
    id: decision
    attributes:
      label: Question or decision
      description: State the uncertainty to resolve; do not assume the preferred solution is correct.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Requirements, constraints, and non-goals
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sources and current evidence
      description: Link authoritative documentation and exact SDK versions/files/symbols where possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Competing approaches
      description: Compare ownership, dependency direction, compatibility, complexity, and failure modes.
    validations:
      required: true
  - type: textarea
    id: experiments
    attributes:
      label: Experiments and decision criteria
      description: Specify representative workloads, controls/ablations, measurements, and disconfirming evidence.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Bounded deliverable
      description: A decision record, prototype, capability matrix, or verified vertical slice.
    validations:
      required: true
