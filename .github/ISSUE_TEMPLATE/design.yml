name: Architecture or contract decision
description: Decide a responsibility, API, data model, or compatibility boundary.
title: "design: "
labels: ["type: design", "area: architecture", "status: triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context and decision required
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership and dependency direction
      description: Name consumers, state owners, boundaries, and the proposed import DAG.
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contract fields and evolution
      description: Include identity, scope, versions, bounds, absent/zero values, units, privacy, and migration.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and evidence
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Decision criteria and verification
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Prerequisite issues and follow-up work
