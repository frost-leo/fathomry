name: Documentation or developer experience
description: Improve instructions, examples, API clarity, localization guidance, or onboarding.
title: "docs: "
labels: ["type: docs", "concern: developer-experience", "status: triage"]
body:
  - type: textarea
    id: audience
    attributes:
      label: Audience and task
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Missing, incorrect, or unclear information
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Authoritative source and working example
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How the updated guidance will be verified
    validations:
      required: true
