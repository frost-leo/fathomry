name: Dependency or toolchain change
description: Evaluate an exact SDK, Go toolchain, skill, or automation version change.
title: "dependency: "
labels: ["type: dependency", "concern: compatibility", "status: triage"]
body:
  - type: input
    id: dependency
    attributes:
      label: Dependency and exact current/target versions
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Motivation and authoritative release/source evidence
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Behavioral and license/provenance changes
      description: Review retries, timeouts, pooling, parsing, lifecycle, security, and public contracts as relevant.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Compatibility, replay, performance, and rollback verification
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and rollout constraints
