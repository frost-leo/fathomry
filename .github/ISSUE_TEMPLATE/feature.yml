name: Feature request
description: Propose user-visible behavior with explicit scope and acceptance.
title: "feat: "
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the need before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance criteria
      description: What tests, examples, or measurements would demonstrate success?
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and operational impact
      description: Consider APIs, schemas, Temporal history, permissions, and resource limits.
