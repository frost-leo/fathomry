name: Checks

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whitespace
        run: git diff-tree --check --root -m -r HEAD
      - name: Check required collaboration assets
        run: git ls-files --error-unmatch README.md LICENSE AGENTS.md .github/CONTRIBUTING.md .github/SECURITY.md .github/CODEOWNERS .github/labels.json
      - name: Test issue scaffolding without network
        run: bash .agents/skills/fathomry-development/scripts/new-issue_test.sh

  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect application module
        id: module
        shell: bash
        run: |
          if [[ -f go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No application module yet; Go application checks are not applicable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        if: steps.module.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache-paths
        if: steps.module.outputs.present == 'true'
        shell: bash
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go caches
        id: go-cache
        if: steps.module.outputs.present == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.modules }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-v1-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-v1-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-v1-${{ steps.go.outputs.go-version }}-
      - name: Verify application
        if: steps.module.outputs.present == 'true'
        shell: bash
        run: |
          go mod tidy -diff
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          cold_package=github.com/frost-leo/fathomry/cmd/fathomry/internal/command/project
          go list ./... > "$RUNNER_TEMP/fathomry-test-packages"
          grep -Fxq "$cold_package" "$RUNNER_TEMP/fathomry-test-packages"
          mapfile -t remaining_packages < <(grep -Fxv "$cold_package" "$RUNNER_TEMP/fathomry-test-packages")
          test "${#remaining_packages[@]}" -gt 0
          go test -p=1 -race -count=1 -timeout=10m "$cold_package"
          go test -p=2 -race -count=1 -timeout=10m "${remaining_packages[@]}"
          go build ./...
      - name: Verify independent mail example
        if: steps.module.outputs.present == 'true'
        run: |
          go vet ./internal/notification/mail/v0/testdata/welcome
          go test -race -count=1 -timeout=2m ./internal/notification/mail/v0/testdata/welcome
      - name: Verify independent Lark / Feishu example
        if: steps.module.outputs.present == 'true'
        run: |
          go vet ./internal/notification/lark/v3/testdata/showcase
          go test -race -count=1 -timeout=2m ./internal/notification/lark/v3/testdata/showcase
      - name: Save Go caches after checks
        if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.modules }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
