name: Checks

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whitespace
        run: git diff-tree --check --root -m -r HEAD
      - name: Check required collaboration assets
        run: git ls-files --error-unmatch README.md LICENSE AGENTS.md .github/CONTRIBUTING.md .github/SECURITY.md .github/CODEOWNERS .github/labels.json
      - name: Test issue scaffolding without network
        run: bash .agents/skills/fathomry-development/scripts/new-issue_test.sh

  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect application module
        id: module
        shell: bash
        run: |
          if [[ -f go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No application module yet; Go application checks are not applicable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.module.outputs.present == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify application
        if: steps.module.outputs.present == 'true'
        shell: bash
        run: |
          go mod tidy -diff
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go test -race -count=1 -timeout=10m ./...
          go build ./...
